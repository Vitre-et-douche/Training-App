<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111111">
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 0 12px 120px; background: #111; color: #eee; }
    nav { display: flex; gap: 8px; padding: 12px 0; position: sticky; top: 0; background: #111; z-index: 5; }
    nav button { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #222; color: #eee; font-size: 1rem; }
    nav button.actif { background: #2e7d32; }
    h1 { font-size: 1.3rem; margin: 8px 0 4px; }
    .date { color: #888; margin-bottom: 16px; }

    .exo { background: #1d1d1d; border-radius: 12px; padding: 12px; margin-bottom: 14px; }
    .exo h2 { font-size: 1.05rem; margin: 0 0 4px; }
    .repos { color: #888; font-size: 0.85rem; margin-bottom: 4px; }
    .note { color: #aaa; font-size: 0.8rem; margin-bottom: 6px; line-height: 1.35; }
    .derniere { color: #6fb36f; font-size: 0.8rem; margin-bottom: 8px; }

    /* Shared grid for column titles and set rows (columns depend on exercise type) */
    .labels, .serie { display: grid; gap: 6px; align-items: center; }
    .t-force { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 64px; }
    .t-reps, .t-duree { grid-template-columns: minmax(0, 1fr) 64px; }
    .edit.t-force { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 48px; }
    .edit.t-reps, .edit.t-duree { grid-template-columns: minmax(0, 1fr) 48px; }

    .labels { color: #888; font-size: 0.75rem; margin-bottom: 4px; }
    .labels span { text-align: center; }
    .serie { margin-bottom: 8px; }
    .serie input { width: 100%; min-width: 0; padding: 12px 6px; border-radius: 8px; border: 1px solid #444;
                   background: #111; color: #eee; font-size: 1.05rem; text-align: center; }
    .serie button { width: 100%; padding: 12px 0; border-radius: 8px; border: none; background: #333;
                    color: #eee; font-size: 1rem; }
    .serie.fait button { background: #2e7d32; }

    .action { display: block; width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: none;
              background: #333; color: #eee; font-size: 1rem; }
    .action.principal { background: #2e7d32; }
    .action.danger { background: #7d2e2e; }
    .vide { color: #888; text-align: center; margin: 30px 0 14px; }
    .sous-titre { color: #888; font-size: 0.85rem; margin: 18px 0 4px; }

    .histo { background: #1d1d1d; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .histo h3 { margin: 0 0 2px; font-size: 1rem; }
    .histo .meta { color: #888; font-size: 0.8rem; margin-bottom: 8px; }
    .histo .ligne { font-size: 0.9rem; margin-bottom: 6px; }
    .histo .detail { color: #aaa; }
    #vue-historique { display: none; }

    /* Edit mode */
    .champ { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444;
             background: #111; color: #eee; font-size: 1rem; margin-bottom: 8px; }
    .ligne-exo { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
    .ligne-exo .champ { margin-bottom: 0; flex: 1; min-width: 0; }
    .mini { padding: 10px 12px; border-radius: 8px; border: none; background: #333; color: #eee; font-size: 1rem; }
    .mini.danger { background: #7d2e2e; }
    .mini:disabled { opacity: 0.3; }
    .serie.edit .mini { width: 100%; padding: 12px 0; }
    .repos-edit { display: flex; align-items: center; gap: 8px; color: #888; font-size: 0.85rem; margin-bottom: 8px; }
    .repos-edit input { width: 90px; padding: 10px; border-radius: 8px; border: 1px solid #444;
                        background: #111; color: #eee; font-size: 1rem; }

    /* Rest timer bar */
    #chrono { position: fixed; left: 0; right: 0; bottom: 0; background: #222; border-top: 2px solid #444;
              padding: 12px 16px; display: none; align-items: center; justify-content: space-between; gap: 8px; }
    #chrono.actif { display: flex; }
    #chrono.fini { background: #2e7d32; }
    #temps { font-size: 2rem; font-variant-numeric: tabular-nums; font-weight: bold; }
    #chrono button { padding: 10px 12px; border-radius: 8px; border: none; background: #444;
                     color: #eee; font-size: 0.95rem; }
  </style>
</head>
<body>
  <nav>
    <button id="nav-seance" class="actif">Workout</button>
    <button id="nav-histo">History</button>
  </nav>

  <!-- WORKOUT VIEW -->
  <div id="vue-seance">
    <div id="contenu-seance"></div>
    <button class="action" id="btn-import">Import a workout (JSON file)</button>
    <input type="file" id="fichier-import" accept=".json,application/json" style="display:none">
  </div>

  <!-- HISTORY VIEW -->
  <div id="vue-historique">
    <div id="contenu-histo"></div>
    <button class="action" id="btn-export">Export history (JSON file)</button>
  </div>

  <div id="chrono">
    <div id="temps">0:00</div>
    <div>
      <button id="moins">-15s</button>
      <button id="plus">+15s</button>
      <button id="stop">Skip</button>
    </div>
  </div>

  <script>
    // ---------- HELPERS ----------
    const CLE_SEANCE = "training-seance-en-cours";
    const CLE_HISTO = "training-historique";

    function lire(cle, defaut) {
      try {
        const v = localStorage.getItem(cle);
        return v ? JSON.parse(v) : defaut;
      } catch (e) { return defaut; }
    }

    function ecrire(cle, valeur) {
      try { localStorage.setItem(cle, JSON.stringify(valeur)); }
      catch (e) { alert("Unable to save on this device."); }
    }

    function esc(texte) {
      return String(texte ?? "").replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // ---------- EXERCISE TYPES ----------
    // force = kg + reps | reps = reps only | duree = seconds
    const TYPES = { force: "Strength (kg × reps)", reps: "Reps only", duree: "Duration (sec)" };

    function champs(type) {
      if (type === "force") return [
        { cle: "kg", label: "Kg", mode: "decimal" },
        { cle: "reps", label: "Reps", mode: "numeric" }
      ];
      if (type === "duree") return [{ cle: "duree_s", label: "Sec", mode: "numeric" }];
      return [{ cle: "reps", label: "Reps", mode: "numeric" }];
    }

    function nouvelleSerie(type, modele) {
      if (type === "force") return { kg: modele?.kg ?? null, reps: modele?.reps ?? 8 };
      if (type === "duree") return { duree_s: modele?.duree_s ?? 30 };
      return { reps: modele?.reps ?? 10 };
    }

    function inputsSerie(type, s) {
      return champs(type).map((f) =>
        `<input type="number" step="any" inputmode="${f.mode}" data-cle="${f.cle}" placeholder="${f.label}" value="${esc(s[f.cle])}">`
      ).join("");
    }

    function brancherInputs(ligne, s) {
      ligne.querySelectorAll("input[data-cle]").forEach((inp) => {
        inp.addEventListener("input", () => {
          s[inp.dataset.cle] = inp.value === "" ? null : Number(inp.value);
          sauver();
        });
      });
    }

    // Text for one set (also reads the old format with "charge")
    function formatSerie(s) {
      if (s.duree_s != null) return esc(s.duree_s) + " s";
      if (s.kg != null) return esc(s.reps) + " × " + esc(s.kg) + " kg";
      if (s.charge) return esc(s.reps) + " × " + esc(s.charge);
      return esc(s.reps) + " reps";
    }

    function normaliser(w) {
      for (const exo of w.exercices) {
        if (!TYPES[exo.type]) exo.type = "reps";
        exo.repos_s = exo.repos_s ?? 60;
        exo.series = exo.series ?? [];
      }
      return w;
    }

    // Sets from the most recent saved workout containing the same exercise
    function derniereFois(exo) {
      if (!exo.id) return null;
      const histo = lire(CLE_HISTO, []);
      for (let i = histo.length - 1; i >= 0; i--) {
        const m = (histo[i].exercices || []).find((e) => e.id === exo.id);
        if (m) {
          const faites = m.series.filter((s) => s.fait);
          if (faites.length) return faites.map(formatSerie).join(" · ");
        }
      }
      return null;
    }

    // ---------- REST TIMER ----------
    let finRepos = null;
    let intervalle = null;
    let wakeLock = null;
    let audio = null;

    const barre = document.getElementById("chrono");
    const affichageTemps = document.getElementById("temps");

    function formater(secondes) {
      const m = Math.floor(secondes / 60);
      const s = secondes % 60;
      return m + ":" + String(s).padStart(2, "0");
    }

    async function garderEcranAllume() {
      try {
        if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
      } catch (e) {}
    }

    function relacherEcran() {
      if (wakeLock) { wakeLock.release(); wakeLock = null; }
    }

    function bip() {
      try {
        if (!audio) audio = new AudioContext();
        const osc = audio.createOscillator();
        osc.frequency.value = 880;
        osc.connect(audio.destination);
        osc.start();
        osc.stop(audio.currentTime + 0.4);
      } catch (e) {}
    }

    function demarrerRepos(secondes) {
      if (!audio) { try { audio = new AudioContext(); } catch (e) {} }
      finRepos = Date.now() + secondes * 1000;
      barre.classList.add("actif");
      barre.classList.remove("fini");
      clearInterval(intervalle);
      intervalle = setInterval(tic, 250);
      tic();
      garderEcranAllume();
    }

    function tic() {
      const restant = Math.ceil((finRepos - Date.now()) / 1000);
      if (restant <= 0) terminerRepos();
      else affichageTemps.textContent = formater(restant);
    }

    function terminerRepos() {
      clearInterval(intervalle);
      affichageTemps.textContent = "Go!";
      barre.classList.add("fini");
      if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
      bip();
      relacherEcran();
      setTimeout(arreterRepos, 4000);
    }

    function arreterRepos() {
      clearInterval(intervalle);
      barre.classList.remove("actif", "fini");
      relacherEcran();
    }

    document.getElementById("plus").addEventListener("click", () => { finRepos += 15000; tic(); });
    document.getElementById("moins").addEventListener("click", () => { finRepos -= 15000; tic(); });
    document.getElementById("stop").addEventListener("click", arreterRepos);

    // ---------- CURRENT WORKOUT ----------
    let seance = lire(CLE_SEANCE, null);
    if (seance && Array.isArray(seance.exercices)) normaliser(seance); else seance = null;
    let modeEdition = false;

    function sauver() { ecrire(CLE_SEANCE, seance); }

    function aujourdhui() { return new Date().toISOString().slice(0, 10); }

    function nouvelExercice() {
      return { id: "exo-" + Date.now(), nom: "New exercise", type: "force", repos_s: 90, series: [nouvelleSerie("force")] };
    }

    function ajouterBouton(parent, texte, classe, action) {
      const b = document.createElement("button");
      b.className = "action " + classe;
      b.textContent = texte;
      b.addEventListener("click", action);
      parent.appendChild(b);
      return b;
    }

    function afficherSeance() {
      const conteneur = document.getElementById("contenu-seance");
      conteneur.innerHTML = "";

      if (!seance) {
        modeEdition = false;
        conteneur.innerHTML = `<div class="vide">No workout in progress.</div><div class="sous-titre">Choose a workout</div>`;
        ajouterChoixSeances(conteneur);
        ajouterBouton(conteneur, "Create an empty workout", "", () => {
          seance = { nom: "New workout", date: aujourdhui(), exercices: [nouvelExercice()] };
          sauver();
          modeEdition = true;
          afficherSeance();
        });
        return;
      }

      ajouterBouton(conteneur, modeEdition ? "Finish editing" : "Edit workout",
        modeEdition ? "principal" : "", () => {
          modeEdition = !modeEdition;
          afficherSeance();
        });

      if (modeEdition) afficherEdition(conteneur);
      else afficherSaisie(conteneur);
    }

    // The workouts listed in programme.json become buttons
    async function ajouterChoixSeances(conteneur) {
      try {
        const reponse = await fetch("programme.json");
        const prog = await reponse.json();
        const zone = document.createElement("div");
        for (const item of prog.seances) {
          ajouterBouton(zone, item.titre, "principal", () => chargerFichier(item.fichier));
        }
        conteneur.insertBefore(zone, conteneur.children[2] || null);
      } catch (e) {
        conteneur.insertAdjacentHTML("beforeend", `<div class="vide">Could not load the program.</div>`);
      }
    }

    async function chargerFichier(fichier) {
      try {
        const reponse = await fetch(fichier);
        const w = normaliser(await reponse.json());
        w.date = aujourdhui();
        seance = w;
        modeEdition = false;
        sauver();
        afficherSeance();
      } catch (e) {
        alert("Unable to load this workout.");
      }
    }

    // ----- Logging mode (during the workout) -----
    function afficherSaisie(conteneur) {
      conteneur.insertAdjacentHTML("beforeend",
        `<h1>${esc(seance.nom)}</h1><div class="date">${esc(seance.date)}</div>`);

      for (const exo of seance.exercices) {
        const t = exo.type;
        const derniere = derniereFois(exo);
        const bloc = document.createElement("div");
        bloc.className = "exo";
        bloc.innerHTML = `
          <h2>${esc(exo.nom)}</h2>
          <div class="repos">Rest: ${esc(exo.repos_s)} s</div>
          ${exo.note ? `<div class="note">${esc(exo.note)}</div>` : ""}
          ${derniere ? `<div class="derniere">Last time: ${derniere}</div>` : ""}
          <div class="labels t-${t}">
            ${champs(t).map((f) => `<span>${f.label}</span>`).join("")}<span></span>
          </div>
        `;

        for (const s of exo.series) {
          const ligne = document.createElement("div");
          ligne.className = "serie t-" + t + (s.fait ? " fait" : "");
          ligne.innerHTML = inputsSerie(t, s) + "<button>OK</button>";
          brancherInputs(ligne, s);
          ligne.querySelector("button").addEventListener("click", () => {
            s.fait = !s.fait;
            ligne.classList.toggle("fait", s.fait);
            if (s.fait) {
              s.heure = new Date().toISOString();
              demarrerRepos(exo.repos_s);
            } else {
              delete s.heure;
            }
            sauver();
          });
          bloc.appendChild(ligne);
        }
        conteneur.appendChild(bloc);
      }

      ajouterBouton(conteneur, "Finish workout", "principal", terminerSeance);
    }

    // ----- Edit mode -----
    function afficherEdition(conteneur) {
      const entete = document.createElement("div");
      entete.innerHTML = `
        <input class="champ" type="text" id="edit-nom" value="${esc(seance.nom)}" placeholder="Workout name">
        <input class="champ" type="date" id="edit-date" value="${esc(seance.date)}">
      `;
      entete.querySelector("#edit-nom").addEventListener("input", (e) => { seance.nom = e.target.value; sauver(); });
      entete.querySelector("#edit-date").addEventListener("input", (e) => { seance.date = e.target.value; sauver(); });
      conteneur.appendChild(entete);

      seance.exercices.forEach((exo, i) => {
        const t = exo.type;
        const bloc = document.createElement("div");
        bloc.className = "exo";

        const haut = document.createElement("div");
        haut.className = "ligne-exo";
        haut.innerHTML = `
          <input class="champ" type="text" value="${esc(exo.nom)}" placeholder="Exercise name">
          <button class="mini" data-act="haut">↑</button>
          <button class="mini" data-act="bas">↓</button>
          <button class="mini danger" data-act="suppr">✕</button>
        `;
        haut.querySelector("input").addEventListener("input", (e) => { exo.nom = e.target.value; sauver(); });
        const btnHaut = haut.querySelector('[data-act="haut"]');
        const btnBas = haut.querySelector('[data-act="bas"]');
        btnHaut.disabled = i === 0;
        btnBas.disabled = i === seance.exercices.length - 1;
        btnHaut.addEventListener("click", () => deplacer(i, -1));
        btnBas.addEventListener("click", () => deplacer(i, 1));
        haut.querySelector('[data-act="suppr"]').addEventListener("click", () => {
          if (confirm('Delete the exercise "' + exo.nom + '"?')) {
            seance.exercices.splice(i, 1);
            sauver();
            afficherSeance();
          }
        });
        bloc.appendChild(haut);

        // Exercise type
        const select = document.createElement("select");
        select.className = "champ";
        for (const [valeur, libelle] of Object.entries(TYPES)) {
          const o = document.createElement("option");
          o.value = valeur; o.textContent = libelle; o.selected = valeur === t;
          select.appendChild(o);
        }
        select.addEventListener("change", (e) => {
          exo.type = e.target.value;
          exo.series = exo.series.map((s) => nouvelleSerie(exo.type, s));
          sauver();
          afficherSeance();
        });
        bloc.appendChild(select);

        // Rest + note
        const repos = document.createElement("div");
        repos.className = "repos-edit";
        repos.innerHTML = `Rest (s) <input type="number" inputmode="numeric" min="0" value="${esc(exo.repos_s)}">`;
        repos.querySelector("input").addEventListener("input", (e) => {
          exo.repos_s = e.target.value === "" ? 0 : Number(e.target.value); sauver();
        });
        bloc.appendChild(repos);

        const note = document.createElement("input");
        note.className = "champ";
        note.type = "text";
        note.placeholder = "Note (optional)";
        note.value = exo.note ?? "";
        note.addEventListener("input", (e) => { exo.note = e.target.value; sauver(); });
        bloc.appendChild(note);

        bloc.insertAdjacentHTML("beforeend",
          `<div class="labels edit t-${t}">${champs(t).map((f) => `<span>${f.label}</span>`).join("")}<span></span></div>`);

        exo.series.forEach((s, j) => {
          const ligne = document.createElement("div");
          ligne.className = "serie edit t-" + t;
          ligne.innerHTML = inputsSerie(t, s) + `<button class="mini danger">✕</button>`;
          brancherInputs(ligne, s);
          ligne.querySelector("button").addEventListener("click", () => {
            exo.series.splice(j, 1);
            sauver();
            afficherSeance();
          });
          bloc.appendChild(ligne);
        });

        const ajout = document.createElement("button");
        ajout.className = "mini";
        ajout.textContent = "+ Add a set";
        ajout.addEventListener("click", () => {
          exo.series.push(nouvelleSerie(t, exo.series[exo.series.length - 1]));
          sauver();
          afficherSeance();
        });
        bloc.appendChild(ajout);

        conteneur.appendChild(bloc);
      });

      ajouterBouton(conteneur, "+ Add an exercise", "", () => {
        seance.exercices.push(nouvelExercice());
        sauver();
        afficherSeance();
      });

      ajouterBouton(conteneur, "Delete the whole workout", "danger", () => {
        if (confirm("Delete this workout in progress (without saving it to history)?")) {
          localStorage.removeItem(CLE_SEANCE);
          seance = null;
          modeEdition = false;
          afficherSeance();
        }
      });
    }

    function deplacer(i, sens) {
      const j = i + sens;
      if (j < 0 || j >= seance.exercices.length) return;
      [seance.exercices[i], seance.exercices[j]] = [seance.exercices[j], seance.exercices[i]];
      sauver();
      afficherSeance();
    }

    function terminerSeance() {
      const faites = seance.exercices.reduce((n, e) => n + e.series.filter((s) => s.fait).length, 0);
      if (faites === 0 && !confirm("No set completed. Finish anyway?")) return;
      if (!confirm("Finish and save this workout to history?")) return;

      const histo = lire(CLE_HISTO, []);
      histo.push({ ...seance, terminee_le: new Date().toISOString() });
      ecrire(CLE_HISTO, histo);

      localStorage.removeItem(CLE_SEANCE);
      seance = null;
      arreterRepos();
      afficherSeance();
      alert("Workout saved to history.");
    }

    // ---------- IMPORT ----------
    const champFichier = document.getElementById("fichier-import");
    document.getElementById("btn-import").addEventListener("click", () => champFichier.click());

    champFichier.addEventListener("change", async () => {
      const fichier = champFichier.files[0];
      if (!fichier) return;
      try {
        const donnees = JSON.parse(await fichier.text());
        if (!donnees.nom || !Array.isArray(donnees.exercices)) throw new Error("format");

        const encours = seance && seance.exercices.some((e) => e.series.some((s) => s.fait));
        if (encours && !confirm("A workout with completed sets is in progress. Replace it?")) return;

        normaliser(donnees);
        for (const exo of donnees.exercices) {
          for (const s of exo.series) s.fait = false;
        }
        donnees.date = aujourdhui();
        seance = donnees;
        modeEdition = false;
        sauver();
        afficherSeance();
      } catch (e) {
        alert("Invalid file: it must contain a name and a list of exercises.");
      }
      champFichier.value = "";
    });

    // ---------- HISTORY ----------
    function afficherHistorique() {
      const conteneur = document.getElementById("contenu-histo");
      const histo = lire(CLE_HISTO, []);
      if (histo.length === 0) {
        conteneur.innerHTML = `<div class="vide">No workout saved yet.</div>`;
        return;
      }
      conteneur.innerHTML = "";
      for (const h of [...histo].reverse()) {
        const faites = h.exercices.reduce((n, e) => n + e.series.filter((s) => s.fait).length, 0);
        const total = h.exercices.reduce((n, e) => n + e.series.length, 0);
        const bloc = document.createElement("div");
        bloc.className = "histo";
        let html = `<h3>${esc(h.nom)}</h3>
          <div class="meta">${esc((h.terminee_le || "").slice(0, 10))} · ${faites}/${total} sets</div>`;
        for (const exo of h.exercices) {
          const detail = exo.series.filter((s) => s.fait).map(formatSerie).join(" · ");
          html += `<div class="ligne"><b>${esc(exo.nom)}</b><br><span class="detail">${detail || "not done"}</span></div>`;
        }
        bloc.innerHTML = html;
        conteneur.appendChild(bloc);
      }
    }

    document.getElementById("btn-export").addEventListener("click", () => {
      const histo = lire(CLE_HISTO, []);
      if (histo.length === 0) { alert("Nothing to export yet."); return; }
      const contenu = JSON.stringify({ exporte_le: new Date().toISOString(), seances: histo }, null, 2);
      const lien = document.createElement("a");
      lien.href = URL.createObjectURL(new Blob([contenu], { type: "application/json" }));
      lien.download = "history-" + new Date().toISOString().slice(0, 10) + ".json";
      lien.click();
      URL.revokeObjectURL(lien.href);
    });

    // ---------- NAVIGATION ----------
    const vueSeance = document.getElementById("vue-seance");
    const vueHisto = document.getElementById("vue-historique");
    const navSeance = document.getElementById("nav-seance");
    const navHisto = document.getElementById("nav-histo");

    navSeance.addEventListener("click", () => {
      vueSeance.style.display = "block"; vueHisto.style.display = "none";
      navSeance.classList.add("actif"); navHisto.classList.remove("actif");
    });
    navHisto.addEventListener("click", () => {
      afficherHistorique();
      vueSeance.style.display = "none"; vueHisto.style.display = "block";
      navHisto.classList.add("actif"); navSeance.classList.remove("actif");
    });

    // ---------- START ----------
    afficherSeance();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
